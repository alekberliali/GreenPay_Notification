image: docker:stable

stages:
  - publish

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "development"


variables:
  TAG_LATEST: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_NAME:latest
  TAG_COMMIT: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_NAME:$CI_COMMIT_SHORT_SHA
  CI_VERSION: "1.0.${CI_PIPELINE_IID}"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_VERSION


publish:
  image: docker:latest
  stage: publish
  services:
    - name: docker:24.0-dind
      alias: docker
  script:
    - docker build -t $IMAGE_TAG .
    - echo "$IMAGE_TAG"
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - >
      if [ "$CI_COMMIT_BRANCH" == "main" ]; then
        FINAL_IMAGE="$CI_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME:main-$CI_VERSION"
      else
        FINAL_IMAGE="$CI_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME:development-$CI_VERSION"
      fi
    - echo "$FINAL_IMAGE"
    - docker tag $IMAGE_TAG $FINAL_IMAGE
    - docker push $FINAL_IMAGE
  tags:
    - build
    
  
