image: docker:stable

stages:
  - setup 
  - publish
  - deploy
  - cleanup

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "development"



variables:
  TAG_LATEST: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_NAME:latest
  TAG_COMMIT: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_NAME:$CI_COMMIT_SHORT_SHA
  CI_VERSION: "1.0.${CI_PIPELINE_ID}"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_VERSION
 
  KUBE_NAMESPACE: "greenpay"

 

.setup_registry_secret_template:
  stage: setup
  script:
    - echo "Setting up GitLab registry secret..."
    - mkdir -p ~/.kube
    - cat "$KUBE_CONFIG" > ~/.kube/config   # Load kubeconfig from GitLab CI/CD variable
    - export KUBECONFIG=~/.kube/config
    - kubectl get nodes                     # Verify Kubernetes access
    - |
      if ! kubectl get ns $KUBE_NAMESPACE; then
        echo "Creating namespace..."
        kubectl create namespace $KUBE_NAMESPACE
      else
        echo "$KUBE_NAMESPACE namespace exists."
      fi
    - |
      if ! kubectl get secret gitlab-registry-secret -n $KUBE_NAMESPACE; then
        echo "Creating GitLab registry secret..."
        kubectl create secret docker-registry gitlab-registry-secret \
          --docker-server=$CI_REGISTRY \
          --docker-username="gitlab+token" \
          --docker-password=$GITLAB_REGISTRY_TOKEN \
          --docker-email=someemail.example.com \
          --namespace $KUBE_NAMESPACE
      else
        echo "GitLab registry secret already exists."
      fi

setup_registry_secret_dev:
  extends: .setup_registry_secret_template
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
  tags:
    - deploy
  variables:
    KUBE_CONFIG: "$KUBECONFIG_DEV"

setup_registry_secret_prod:
  extends: .setup_registry_secret_template
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  tags:
    - deploy-prod
  variables:
    KUBE_CONFIG: "$KUBECONFIG_PROD"




publish:
  image: docker:latest
  stage: publish
  services:
    - name: docker:24.0-dind
      alias: docker
  script:
    - docker build -t $IMAGE_TAG .
    - echo "$IMAGE_TAG"
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - >
      if [ "$CI_COMMIT_BRANCH" == "main" ]; then
        FINAL_IMAGE="$CI_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME:main-$CI_VERSION"
      else
        FINAL_IMAGE="$CI_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME:development-$CI_VERSION"
      fi
    - echo "$FINAL_IMAGE"
    - docker tag $IMAGE_TAG $FINAL_IMAGE
    - docker push $FINAL_IMAGE
  tags:
    - build
  

.deploy_template: &deploy_template
  stage: deploy
  before_script:
    - export KUBECONFIG=~/.kube/config
    - |
      SECRET_PATH=$(grep "^$CI_PROJECT_ID," $CONFIG_SECRET_PATH | cut -d',' -f2 | tr -d ' ')
      echo "Dynamic Variable: $SECRET_PATH"
    - |
      SERVICE_NAME=$(grep "^$CI_PROJECT_ID," $CONFIG_SERVICE_NAME | cut -d',' -f2 | tr -d ' ')
      echo "Dynamic Variable: $SERVICE_NAME"
    - git clone -b $CI_COMMIT_BRANCH https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.greentekpay.com/infra/helm/ms-chart.git helm-charts
  script:
    - helm upgrade --install "$SERVICE_NAME" "./helm-charts/java-charts/" --namespace "$KUBE_NAMESPACE" --create-namespace --set serviceName=$SERVICE_NAME --set secretPath=$SECRET_PATH --set image.repository=$CI_REGISTRY_IMAGE --set image.tag=$CI_COMMIT_BRANCH-$CI_VERSION
    - >
      if ! kubectl rollout status deployment/$SERVICE_NAME --namespace $KUBE_NAMESPACE --timeout=60s; then
        echo "Deployment rollout failed"
        exit 1
      fi
  tags:
    - deploy

deploy_dev:
  <<: *deploy_template
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
  tags:
    - deploy

deploy_prod:
  <<: *deploy_template
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  tags:
    - deploy-prod
    
cleanup:
  stage: cleanup
  script:
    - kubectl delete deployments.apps  $SERVICE_NAME -n  $KUBE_NAMESPACE --ignore-not-found=true
    - kubectl delete service $SERVICE_NAME -n  $KUBE_NAMESPACE --ignore-not-found=true

  when: manual
  only:
    - development
  tags:
    - deploy




