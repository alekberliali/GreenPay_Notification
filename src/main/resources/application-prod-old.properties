spring.cloud.vault.port=${VAULT_PORT}
spring.cloud.vault.host=${VAULT_HOST}
spring.cloud.vault.scheme=${VAULT_SCHEMA}
spring.cloud.vault.authentication=${VAULT_AUTHENTICATION}
spring.cloud.vault.app-role.role=${VAULT_ROLE}
spring.cloud.vault.app-role.role-id=${VAULT_ROLE_ID}
spring.cloud.vault.app-role.secret-id=${VAULT_SECRET_ID}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=${VAULT_BACKEND}
spring.cloud.vault.kv.default-context=${VAULT_DEFAULT_CONTEXT}
spring.config.import=vault://

spring.datasource.url=jdbc:postgresql://${JDBC_HOST:"notification-history-db"}:${JDBC_PORT:"8010"}/${JDBC_DATABASE:"notification_db"}
spring.datasource.username=${JDBC_USERNAME:"notification"}
spring.datasource.password=${JDBC_PASSWORD:"Password12*"}
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true
